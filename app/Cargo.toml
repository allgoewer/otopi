[package]
name = "otopi"
version = "0.1.0"
edition = "2021"
description = "NE3 WiFi otoscope viewer for Raspberry Pi"
license = "MIT"

[dependencies]
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
zune-jpeg = "0.5.15"
drm = "0.15.0"
font8x8 = "0.3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[dev-dependencies]
jpeg-encoder = "0.7.1"
