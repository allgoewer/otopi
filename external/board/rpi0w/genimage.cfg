image boot.vfat {
	vfat {
		files = {
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/start_cd.elf",
			"rpi-firmware/fixup_cd.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"bcm2708-rpi-zero-w.dtb",
			"zImage"
		}
		file overlays/vc4-kms-v3d.dtbo { image = "rpi-firmware/overlays/vc4-kms-v3d.dtbo" }
		file overlays/disable-bt.dtbo { image = "rpi-firmware/overlays/disable-bt.dtbo" }
		file overlays/dwc2.dtbo { image = "rpi-firmware/overlays/dwc2.dtbo" }
	}
	size = 32M
}

# Settings and SSH keys: the only partition the Pi writes to and offers over
# USB, so that the boot partition stays intact.
image settings.vfat {
	vfat {
		label = "OTOPI"
		files = {
			"otopi.conf"
		}
	}
	size = 8M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition settings {
		partition-type = 0xC
		image = "settings.vfat"
	}
}
