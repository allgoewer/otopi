# otopi settings. This file is on the SD card's boot partition; edit it on
# any computer. Changes take effect at the next boot.

# rotate: keep the image level using the otoscope's tilt sensor
#   snap  follow the sensor, but lock to 0/90/180/270 degrees when within
#         about 8 degrees of it (default)
#   free  follow the sensor at any angle
#   off   never rotate
rotate = snap

# SSH (debugging over the USB cable, ssh root@10.55.0.1): put your public key
# in ssh/authorized_keys on this partition. The Pi saves its host keys in
# ssh/ on the first boot.
